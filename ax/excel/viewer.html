<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>엑셀 뷰어 - 가독성 테이블</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    @font-face {
      font-family: 'Pretendard';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('https://image.yes24.com/sysimage/font/Ptd/Pretendard-Regular.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Pretendard';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('https://image.yes24.com/sysimage/font/Ptd/Pretendard-SemiBold.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Pretendard';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('https://image.yes24.com/sysimage/font/Ptd/Pretendard-Bold.woff2') format('woff2');
    }

    :root {
      --bg: #f7f8fc;
      --panel: #ffffff;
      --line: #e5e9f0;
      --text: #1a1d23;
      --muted: #5f6b7a;
      --primary: #3366ff;
      --primary-soft: #eaf0ff;
      --shadow: 0 4px 24px rgba(0, 0, 0, .06);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -.02em;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .upload-area {
      background: var(--panel);
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      padding: 20px 24px;
      text-align: center;
      transition: border-color .2s, background .2s;
      cursor: pointer;
      position: relative;
    }

    .upload-area:hover,
    .upload-area.dragover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .upload-area .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .upload-area .label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .upload-area .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .info-bar .file-info {
      font-size: 13px;
      color: var(--muted);
    }

    .info-bar .file-info strong {
      color: var(--text);
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls select,
    .controls input[type="search"] {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .controls select:focus,
    .controls input[type="search"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(51, 102, 255, .1);
    }

    .controls input[type="search"] {
      width: 240px;
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
      max-height: calc(100vh - 280px);
      overflow-y: auto;
    }

    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      white-space: nowrap;
    }

    .excel-table thead {
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .excel-table thead th {
      background: #f1f3f8;
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .02em;
      padding: 10px 14px;
      border-bottom: 2px solid var(--line);
      border-right: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      transition: background .15s;
    }

    .excel-table thead th:hover {
      background: #e4e9f4;
    }

    .excel-table thead th:last-child {
      border-right: none;
    }

    .excel-table thead th .sort-icon {
      display: inline-block;
      margin-left: 4px;
      opacity: .4;
      font-size: 11px;
    }

    .excel-table thead th.sorted .sort-icon {
      opacity: 1;
      color: var(--primary);
    }

    .excel-table tbody tr {
      transition: background .1s;
    }

    .excel-table tbody tr:nth-child(even) {
      background: #fafbfd;
    }

    .excel-table tbody tr:hover {
      background: #eef3ff;
    }

    .excel-table tbody td {
      padding: 9px 14px;
      border-bottom: 1px solid #f0f2f5;
      border-right: 1px solid #f0f2f5;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .excel-table tbody td:last-child {
      border-right: none;
    }

    .excel-table tbody td.wrap-cell {
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 500px;
    }

    .row-num {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      min-width: 40px;
      background: #f8f9fc;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state .title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .empty-state .desc {
      font-size: 13px;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-chip .stat-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-chip .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .btn-wrap-toggle {
      height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .btn-wrap-toggle:hover {
      background: #f0f3f9;
    }

    .btn-wrap-toggle.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .highlight-match {
      background: #fff3cd;
      padding: 0 2px;
      border-radius: 2px;
    }

    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .pagination-bar .page-btns {
      display: flex;
      gap: 4px;
    }

    .pagination-bar button {
      height: 30px;
      min-width: 30px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
    }

    .pagination-bar button:hover {
      background: #f0f3f9;
    }

    .pagination-bar button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .pagination-bar button:disabled {
      opacity: .4;
      cursor: default;
    }

    @media (max-width: 768px) {
      .wrap {
        padding: 14px;
      }

      .page-header {
        flex-direction: column;
      }

      .controls {
        width: 100%;
      }

      .controls input[type="search"] {
        width: 100%;
      }

      .stats-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="page-header">
      <div>
        <h1>📊 엑셀 뷰어</h1>
        <p>엑셀 파일을 업로드하면 가독성 있는 테이블 형태로 표시합니다. 정렬, 검색, 시트 전환을 지원합니다.</p>
      </div>
    </div>

    <div class="upload-area" id="uploadArea">
      <div class="icon">📁</div>
      <div class="label">엑셀 파일을 드래그하거나 클릭하여 업로드</div>
      <div class="hint">.xlsx, .xls, .xlsm, .csv 형식 지원</div>
      <input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm,.csv" />
    </div>

    <div id="contentArea" style="display:none;">
      <div class="info-bar">
        <div class="file-info" id="fileInfo"></div>
        <div class="controls">
          <select id="sheetSelect" title="시트 선택"></select>
          <input id="searchInput" type="search" placeholder="검색어 입력..." />
          <button class="btn-wrap-toggle" id="wrapToggle" type="button">줄바꿈</button>
          <select id="pageSizeSelect" title="페이지 크기">
            <option value="50">50행</option>
            <option value="100" selected>100행</option>
            <option value="200">200행</option>
            <option value="500">500행</option>
            <option value="0">전체</option>
          </select>
        </div>
      </div>

      <div class="stats-row" id="statsRow"></div>

      <div class="table-wrap">
        <div class="table-scroll" id="tableScroll">
          <table class="excel-table" id="excelTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pagination-bar" id="paginationBar" style="display:none;">
          <div class="page-info" id="pageInfo"></div>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="icon">📋</div>
      <div class="title">엑셀 파일을 업로드해 주세요</div>
      <div class="desc">파일을 업로드하면 시트 데이터를 테이블로 변환하여 보여드립니다.</div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // 상태 관리
      var state = {
        workbook: null,
        fileName: '',
        headers: [],
        allRows: [],
        filteredRows: [],
        currentPage: 1,
        pageSize: 100,
        sortCol: -1,
        sortAsc: true,
        wrapMode: false,
        searchQuery: ''
      };

      // 유틸
      function escapeHtml(str) {
        var val = String(str == null ? '' : str).trim();
        return val.replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }

      function normalize(val) {
        return String(val == null ? '' : val).replace(/\r\n/g, '\n').trim();
      }

      // DOM 헬퍼
      function byId(id) { return document.getElementById(id); }

      // 파일 업로드 처리
      byId('fileInput').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (file) loadFile(file);
      });

      // 드래그 앤 드롭
      var uploadArea = byId('uploadArea');
      uploadArea.addEventListener('dragover', function (e) {
        e.preventDefault();
        uploadArea.classList.add('dragover');
      });
      uploadArea.addEventListener('dragleave', function () {
        uploadArea.classList.remove('dragover');
      });
      uploadArea.addEventListener('drop', function (e) {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        var file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) loadFile(file);
      });

      function loadFile(file) {
        if (!window.XLSX) {
          alert('SheetJS 라이브러리 로딩 실패. 페이지를 새로고침하거나 네트워크 연결을 확인해 주세요.');
          return;
        }

        var reader = new FileReader();
        reader.onload = function (e) {
          try {
            state.workbook = XLSX.read(e.target.result, { type: 'array' });
            state.fileName = file.name;

            var names = state.workbook.SheetNames || [];
            var selectHtml = '';
            for (var i = 0; i < names.length; i++) {
              selectHtml += '<option value="' + escapeHtml(names[i]) + '">' + escapeHtml(names[i]) + '</option>';
            }
            byId('sheetSelect').innerHTML = selectHtml;

            loadSheet(names[0]);
            byId('uploadArea').style.display = 'none';
            byId('emptyState').style.display = 'none';
            byId('contentArea').style.display = 'block';
          } catch (err) {
            var msg = '파일을 읽는 중 오류가 발생했습니다.';
            if (err && (String(err.message).indexOf('Encrypted') >= 0 || String(err.message).indexOf('password') >= 0)) {
              msg = '암호가 설정된 파일은 열 수 없습니다. 비밀번호를 해제한 후 다시 시도해 주세요.';
            }
            alert(msg);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function loadSheet(sheetName) {
        var sheet = state.workbook.Sheets[sheetName];
        var data = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

        // 빈 행 제거 후 헤더 찾기
        var headerIdx = 0;
        for (var i = 0; i < Math.min(data.length, 10); i++) {
          var nonEmpty = 0;
          for (var j = 0; j < (data[i] || []).length; j++) {
            if (normalize(data[i][j])) nonEmpty++;
          }
          if (nonEmpty >= 2) {
            headerIdx = i;
            break;
          }
        }

        state.headers = (data[headerIdx] || []).map(function (h, idx) { return normalize(h) || ('Column_' + (idx + 1)); });
        state.allRows = [];

        for (var r = headerIdx + 1; r < data.length; r++) {
          var row = data[r] || [];
          var hasContent = false;
          for (var c = 0; c < row.length; c++) {
            if (normalize(row[c])) { hasContent = true; break; }
          }
          if (hasContent) {
            state.allRows.push(row.map(function (cell) { return normalize(cell); }));
          }
        }

        state.currentPage = 1;
        state.sortCol = -1;
        state.sortAsc = true;
        state.searchQuery = '';
        byId('searchInput').value = '';

        updateFileInfo(sheetName);
        applyFilterAndRender();
      }

      function updateFileInfo(sheetName) {
        byId('fileInfo').innerHTML = '<strong>' + escapeHtml(state.fileName) + '</strong> &nbsp;·&nbsp; 시트: ' + escapeHtml(sheetName) + ' &nbsp;·&nbsp; ' + state.allRows.length.toLocaleString('ko-KR') + '행 × ' + state.headers.length + '열';
      }

      function applyFilterAndRender() {
        var query = state.searchQuery.toLowerCase();

        if (!query) {
          state.filteredRows = state.allRows.slice();
        } else {
          state.filteredRows = [];
          for (var i = 0; i < state.allRows.length; i++) {
            var rowText = state.allRows[i].join(' ').toLowerCase();
            if (rowText.indexOf(query) >= 0) {
              state.filteredRows.push(state.allRows[i]);
            }
          }
        }

        // 정렬 적용
        if (state.sortCol >= 0) {
          var col = state.sortCol;
          var asc = state.sortAsc;
          state.filteredRows.sort(function (a, b) {
            var va = a[col] || '';
            var vb = b[col] || '';
            // 숫자 비교 시도
            var na = Number(va);
            var nb = Number(vb);
            if (!isNaN(na) && !isNaN(nb) && va !== '' && vb !== '') {
              return asc ? na - nb : nb - na;
            }
            var cmp = va.localeCompare(vb, 'ko');
            return asc ? cmp : -cmp;
          });
        }

        renderStats();
        renderTable();
        renderPagination();
      }

      function renderStats() {
        var html = '<div class="stat-chip"><span class="stat-label">전체 행</span><span class="stat-value">' + state.allRows.length.toLocaleString('ko-KR') + '</span></div>';
        html += '<div class="stat-chip"><span class="stat-label">열 수</span><span class="stat-value">' + state.headers.length + '</span></div>';
        if (state.searchQuery) {
          html += '<div class="stat-chip"><span class="stat-label">검색 결과</span><span class="stat-value">' + state.filteredRows.length.toLocaleString('ko-KR') + '</span></div>';
        }
        html += '<div class="stat-chip"><span class="stat-label">시트 수</span><span class="stat-value">' + (state.workbook ? state.workbook.SheetNames.length : 0) + '</span></div>';
        byId('statsRow').innerHTML = html;
      }

      function renderTable() {
        // 헤더 렌더링
        var headHtml = '<tr><th class="row-num">#</th>';
        for (var h = 0; h < state.headers.length; h++) {
          var sortedClass = state.sortCol === h ? ' sorted' : '';
          var icon = state.sortCol === h ? (state.sortAsc ? '▲' : '▼') : '⇅';
          headHtml += '<th class="' + sortedClass + '" data-col="' + h + '">' + escapeHtml(state.headers[h]) + '<span class="sort-icon">' + icon + '</span></th>';
        }
        headHtml += '</tr>';
        byId('tableHead').innerHTML = headHtml;

        // 페이징 계산
        var pageSize = state.pageSize;
        var totalRows = state.filteredRows.length;
        var start = 0;
        var end = totalRows;

        if (pageSize > 0) {
          start = (state.currentPage - 1) * pageSize;
          end = Math.min(start + pageSize, totalRows);
        }

        // 본문 렌더링
        var bodyHtml = '';
        var wrapClass = state.wrapMode ? ' wrap-cell' : '';
        var query = state.searchQuery.toLowerCase();

        for (var i = start; i < end; i++) {
          var row = state.filteredRows[i];
          bodyHtml += '<tr><td class="row-num">' + (i + 1) + '</td>';
          for (var c = 0; c < state.headers.length; c++) {
            var cellVal = row[c] || '';
            var displayVal = escapeHtml(cellVal);
            if (query && cellVal.toLowerCase().indexOf(query) >= 0) {
              displayVal = highlightText(cellVal, query);
            }
            bodyHtml += '<td class="' + wrapClass + '" title="' + escapeHtml(cellVal) + '">' + displayVal + '</td>';
          }
          bodyHtml += '</tr>';
        }

        if (!bodyHtml) {
          bodyHtml = '<tr><td colspan="' + (state.headers.length + 1) + '" style="text-align:center;padding:40px;color:var(--muted);">표시할 데이터가 없습니다.</td></tr>';
        }

        byId('tableBody').innerHTML = bodyHtml;
      }

      function highlightText(text, query) {
        var result = '';
        var lower = text.toLowerCase();
        var idx = 0;
        while (idx < text.length) {
          var pos = lower.indexOf(query, idx);
          if (pos < 0) {
            result += escapeHtml(text.substring(idx));
            break;
          }
          result += escapeHtml(text.substring(idx, pos));
          result += '<span class="highlight-match">' + escapeHtml(text.substring(pos, pos + query.length)) + '</span>';
          idx = pos + query.length;
        }
        return result;
      }

      function renderPagination() {
        var pageSize = state.pageSize;
        var total = state.filteredRows.length;

        if (pageSize <= 0 || total <= pageSize) {
          byId('paginationBar').style.display = 'none';
          return;
        }

        byId('paginationBar').style.display = 'flex';
        var totalPages = Math.ceil(total / pageSize);
        var current = state.currentPage;

        byId('pageInfo').textContent = total.toLocaleString('ko-KR') + '건 중 ' + ((current - 1) * pageSize + 1) + ' ~ ' + Math.min(current * pageSize, total) + ' 표시';

        var btnsHtml = '<button data-page="prev" ' + (current <= 1 ? 'disabled' : '') + '>◀</button>';
        var startPage = Math.max(1, current - 3);
        var endPage = Math.min(totalPages, current + 3);

        if (startPage > 1) btnsHtml += '<button data-page="1">1</button><button disabled>…</button>';

        for (var p = startPage; p <= endPage; p++) {
          btnsHtml += '<button data-page="' + p + '"' + (p === current ? ' class="active"' : '') + '>' + p + '</button>';
        }

        if (endPage < totalPages) btnsHtml += '<button disabled>…</button><button data-page="' + totalPages + '">' + totalPages + '</button>';
        btnsHtml += '<button data-page="next" ' + (current >= totalPages ? 'disabled' : '') + '>▶</button>';

        byId('pageBtns').innerHTML = btnsHtml;
      }

      // 이벤트 바인딩
      byId('sheetSelect').addEventListener('change', function () {
        loadSheet(this.value);
      });

      byId('searchInput').addEventListener('input', function () {
        state.searchQuery = this.value.trim();
        state.currentPage = 1;
        applyFilterAndRender();
      });

      byId('wrapToggle').addEventListener('click', function () {
        state.wrapMode = !state.wrapMode;
        this.classList.toggle('active', state.wrapMode);
        renderTable();
      });

      byId('pageSizeSelect').addEventListener('change', function () {
        state.pageSize = parseInt(this.value, 10);
        state.currentPage = 1;
        applyFilterAndRender();
      });

      // 헤더 클릭 정렬
      byId('tableHead').addEventListener('click', function (e) {
        var th = e.target.closest('th');
        if (!th || !th.hasAttribute('data-col')) return;
        var col = parseInt(th.getAttribute('data-col'), 10);
        if (state.sortCol === col) {
          state.sortAsc = !state.sortAsc;
        } else {
          state.sortCol = col;
          state.sortAsc = true;
        }
        applyFilterAndRender();
      });

      // 페이지네이션 클릭
      byId('paginationBar').addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn || btn.disabled) return;
        var page = btn.getAttribute('data-page');
        var totalPages = Math.ceil(state.filteredRows.length / state.pageSize);

        if (page === 'prev') {
          state.currentPage = Math.max(1, state.currentPage - 1);
        } else if (page === 'next') {
          state.currentPage = Math.min(totalPages, state.currentPage + 1);
        } else {
          state.currentPage = parseInt(page, 10);
        }
        renderTable();
        renderPagination();
        byId('tableScroll').scrollTop = 0;
      });
    })();
  </script>
</body>

</html>
