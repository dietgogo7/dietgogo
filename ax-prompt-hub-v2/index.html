    /* ===================== LIST PAGE ===================== */
    const ListPage = ({ prompts, nav, search, setSearch, filterCat, setFilterCat, sortBy, setSortBy, onToggleFav, onToggleLike, onSearch }) => {
      const filtered = useMemo(() => {
        let list = prompts;
        if (filterCat && filterCat !== '전체') list = list.filter(p => p.category === filterCat);
        if (search) {
          const q = search.toLowerCase();
          list = list.filter(p =>
            p.title.toLowerCase().includes(q) ||
            p.description.toLowerCase().includes(q) ||
            p.promptBody.toLowerCase().includes(q) ||
            p.tags.some(t => t.toLowerCase().includes(q))
          );
        }
        switch(sortBy) {
          case 'popular': return [...list].sort((a,b) => b.likes - a.likes);
          case 'views':   return [...list].sort((a,b) => b.views - a.views);
          case 'copies':  return [...list].sort((a,b) => b.copies - a.copies);
          default:        return [...list].sort((a,b) => b.createdAt.localeCompare(a.createdAt));
        }
      }, [prompts, filterCat, search, sortBy]);

        <div className="max-w-5xl mx-auto">

        navigator.clipboard.writeText(prompt.promptBody).catch(() => {});
        onCopy(prompt.id);

      const handleComment = () => {
        if (!commentText.trim()) { setCommentError('댓글 내용을 입력해주세요.'); return; }
        onAddComment(prompt.id, commentText.trim());
        setCommentText('');
        setCommentError('');

        <div className="max-w-5xl mx-auto">

            <span className="text-gray-600">{prompt.title}</span>

                    {isOwner && (

                        <button onClick={() => nav('edit', prompt.id)}

                        <button onClick={() => onDeletePrompt(prompt.id)}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-red-200 text-sm text-red-500 hover:bg-red-50 btn-transition">

                  <span><span className="text-gray-400 text-xs">등록일</span> <span className="font-medium text-gray-700">{prompt.createdAt}</span></span>
                  <span><span className="text-gray-400 text-xs">수정일</span> <span className="font-medium text-gray-700">{prompt.updatedAt}</span></span>
                </div>

                    <span className="flex items-center gap-1.5"><IcCopy size={14} />{prompt.copies.toLocaleString()} 복사</span>
                    <span className="flex items-center gap-1.5"><IcHeart size={14} />{prompt.likes} 좋아요</span>
                    <span className="flex items-center gap-1.5"><IcMsg size={14} />{prompt.comments.length} 댓글</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => onToggleFav(prompt.id)}
                      className={`flex items-center gap-1.5 px-3 py-2 rounded-lg border text-sm font-medium btn-transition
                        ${prompt.isFavorited ? 'bg-amber-50 border-amber-200 text-amber-600' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                      <IcStar size={15} filled={prompt.isFavorited} />
                      {prompt.isFavorited ? '즐겨찾기됨' : '즐겨찾기'}
                    </button>
                    <button onClick={() => onToggleLike(prompt.id)}
                      className={`flex items-center gap-1.5 px-3 py-2 rounded-lg border text-sm font-medium btn-transition
                        ${prompt.isLiked ? 'bg-rose-50 border-rose-200 text-rose-600' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}>

                      <span key={t} className="text-sm text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">#{t}</span>

                  </div>

                    <textarea
                      value={commentText}
                      onChange={e => { setCommentText(e.target.value); setCommentError(''); }}

    /* ===================== PROMPT FORM (Create & Edit) ===================== */
    const PromptForm = ({ mode, initialData, onSubmit, onCancel }) => {
      const [form, setForm] = useState({
        title: initialData?.title || '',
        description: initialData?.description || '',
        category: initialData?.category || '',
        promptBody: initialData?.promptBody || '',
        howToUse: initialData?.howToUse || '',
        exampleInput: initialData?.exampleInput || '',
        exampleOutput: initialData?.exampleOutput || '',
        tags: initialData?.tags?.join(', ') || '',
      });
      const [errors, setErrors] = useState({});

      const set = (field, val) => {
        setForm(f => ({ ...f, [field]: val }));
        if (errors[field]) setErrors(e => ({ ...e, [field]: '' }));
      };

      const validate = () => {
        const e = {};
        if (!form.title.trim()) e.title = '제목을 입력해주세요.';
        if (!form.description.trim()) e.description = '한 줄 설명을 입력해주세요.';
        if (!form.category) e.category = '목적을 선택해주세요.';
        if (!form.promptBody.trim()) e.promptBody = '프롬프트 본문을 입력해주세요.';
        setErrors(e);
        return Object.keys(e).length === 0;
      };

      const handleSubmit = () => {
        if (!validate()) return;
        const tags = form.tags.split(',').map(t => t.trim()).filter(Boolean);
        onSubmit({ ...form, tags });
      };

      const isEdit = mode === 'edit';
      return (
        <div className="max-w-4xl mx-auto">
          <div className="flex items-center gap-1.5 text-xs text-gray-400 mb-4">
            <button onClick={onCancel} className="hover:text-indigo-600 flex items-center gap-1">
              <IcArrowLeft size={13} /> {isEdit ? '상세로' : '목록으로'}
            </button>
            <IcChevronRight size={12} />
            <span className="text-gray-600">{isEdit ? '프롬프트 수정' : '프롬프트 등록'}</span>
          </div>
          <div className="flex gap-5">
            {/* Form */}
            <div className="flex-1">
              <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-4">
                <h1 className="text-lg font-bold text-gray-900 mb-1">
                  {isEdit ? '프롬프트 수정' : '프롬프트 등록'}
                </h1>
                <p className="text-xs text-gray-500 mb-6">
                  프롬프트를 다른 구성원이 쉽게 이해하고 재사용할 수 있도록 작성해주세요.
                </p>
                {/* Title */}
                <div className="mb-5">
                  <label className="block text-sm font-medium text-gray-700 mb-1.5">
                    제목 <span className="text-red-500">*</span>
                  </label>
                  <input type="text" value={form.title} onChange={e => set('title', e.target.value)}
                    placeholder="프롬프트 이름을 입력하세요"
                    className={`w-full px-3 py-2.5 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                      ${errors.title ? 'border-red-300' : 'border-gray-200'}`} />
                  {errors.title && <p className="text-xs text-red-500 mt-1">{errors.title}</p>}
                </div>
                {/* Description */}
                <div className="mb-5">
                  <label className="block text-sm font-medium text-gray-700 mb-1.5">
                    한 줄 설명 <span className="text-red-500">*</span>
                  </label>
                  <input type="text" value={form.description} onChange={e => set('description', e.target.value)}
                    placeholder="프롬프트 용도를 한 줄로 요약하세요"
                    className={`w-full px-3 py-2.5 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                      ${errors.description ? 'border-red-300' : 'border-gray-200'}`} />
                  {errors.description && <p className="text-xs text-red-500 mt-1">{errors.description}</p>}
                </div>
                {/* Category */}
                <div className="mb-5">
                  <label className="block text-sm font-medium text-gray-700 mb-1.5">
                    목적 <span className="text-red-500">*</span>
                  </label>
                  <select value={form.category} onChange={e => set('category', e.target.value)}
                    className={`w-full px-3 py-2.5 text-sm border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                      ${errors.category ? 'border-red-300' : 'border-gray-200'} ${!form.category ? 'text-gray-400' : 'text-gray-700'}`}>
                    <option value="">목적을 선택하세요</option>
                    {CATEGORIES.slice(1).map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  {errors.category && <p className="text-xs text-red-500 mt-1">{errors.category}</p>}
                </div>
                {/* Prompt Body */}
                <div className="mb-5">
                  <label className="block text-sm font-medium text-gray-700 mb-1.5">
                    프롬프트 본문 <span className="text-red-500">*</span>
                  </label>
                  <textarea value={form.promptBody} onChange={e => set('promptBody', e.target.value)}
                    placeholder="실제 사용할 프롬프트를 입력하세요. 변수는 [대괄호]로 표시하면 좋습니다."
                    rows={10}
                    className={`w-full px-3 py-2.5 text-sm border rounded-lg resize-vertical focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent font-mono
                      ${errors.promptBody ? 'border-red-300' : 'border-gray-200'}`} />
                  {errors.promptBody && <p className="text-xs text-red-500 mt-1">{errors.promptBody}</p>}
                </div>
                {/* Tags */}
                <div className="mb-5">
                  <label className="block text-sm font-medium text-gray-700 mb-1.5">
                    태그 <span className="text-gray-400 font-normal">(선택)</span>
                  </label>
                  <input type="text" value={form.tags} onChange={e => set('tags', e.target.value)}
                    placeholder="태그를 쉼표로 구분하여 입력하세요 (예: 보고서, 기획, 임원)"
                    className="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                </div>
              </div>
              {/* Optional sections */}
              <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-4">
                <h2 className="text-sm font-semibold text-gray-700 mb-4">추가 정보 <span className="text-gray-400 font-normal text-xs">(선택)</span></h2>
                <div className="mb-5">
                  <label className="block text-sm font-medium text-gray-700 mb-1.5">사용 방법</label>
                  <textarea value={form.howToUse} onChange={e => set('howToUse', e.target.value)}
                    placeholder="어떤 상황에서 어떻게 쓰는지 설명해주세요"
                    rows={3}
                    className="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1.5">예시 입력</label>
                    <textarea value={form.exampleInput} onChange={e => set('exampleInput', e.target.value)}
                      placeholder="사용자가 넣어야 할 입력 예시"
                      rows={4}
                      className="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1.5">예시 출력</label>
                    <textarea value={form.exampleOutput} onChange={e => set('exampleOutput', e.target.value)}
                      placeholder="기대되는 출력 예시"
                      rows={4}
                      className="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                  </div>
                </div>
              </div>
              {/* Warning */}
              <div className="flex items-start gap-2.5 p-4 bg-amber-50 border border-amber-200 rounded-xl mb-5 text-sm text-amber-700">
                <IcAlert size={16} className="text-amber-500 flex-shrink-0 mt-0.5" />
                <span>개인정보, 고객정보, 계정정보, API Key, 계약정보 등 민감정보는 포함하지 마세요.</span>
              </div>
              {/* Buttons */}
              <div className="flex justify-end gap-3">
                <button onClick={onCancel}
                  className="px-5 py-2.5 rounded-lg border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 btn-transition">
                  취소
                </button>
                <button onClick={handleSubmit}
                  className="px-6 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 btn-transition">
                  {isEdit ? '저장' : '등록'}
                </button>
              </div>
            </div>
            {/* Sidebar */}
            <div className="w-64 flex-shrink-0">
              {isEdit ? (
                <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-5 sticky top-0">
                  <h3 className="text-sm font-semibold text-gray-700 mb-3">현재 통계</h3>
                  <div className="space-y-3">
                    {[
                      { label:'조회수', val: initialData?.views || 0, icon: <IcEye size={14} /> },
                      { label:'복사 횟수', val: initialData?.copies || 0, icon: <IcCopy size={14} /> },
                      { label:'좋아요 수', val: initialData?.likes || 0, icon: <IcHeart size={14} /> },
                    ].map(s => (
                      <div key={s.label} className="flex items-center justify-between">
                        <span className="flex items-center gap-1.5 text-sm text-gray-500">{s.icon}{s.label}</span>
                        <span className="font-semibold text-gray-800">{s.val.toLocaleString()}</span>
                      </div>
                    ))}
                  </div>
                  {initialData?.tags?.length > 0 && (
                    <div className="mt-4 pt-4 border-t border-gray-100">
                      <p className="text-xs text-gray-500 mb-2">현재 태그</p>
                      <div className="flex flex-wrap gap-1">
                        {initialData.tags.map(t => (
                          <span key={t} className="text-xs text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded-full">#{t}</span>
                        ))}

                    </div>

              ) : (
                <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-5 sticky top-0">

                  <div className="space-y-3 text-xs text-gray-500">
                    {[
                      { icon:'✏️', tip:'제목은 프롬프트 목적이 바로 보이도록 명확하게 작성하세요.' },
                      { icon:'🎯', tip:'목적을 정확히 선택하면 다른 사용자가 쉽게 찾을 수 있습니다.' },
                      { icon:'📋', tip:'변수 입력 부분은 [대괄호]로 표시하면 재사용하기 좋습니다.' },
                      { icon:'🏷️', tip:'태그를 잘 달수록 검색에 잘 걸립니다.' },
                      { icon:'📖', tip:'사용 방법과 예시를 추가하면 다른 사람이 더 쉽게 활용할 수 있습니다.' },
                    ].map((g, i) => (
                      <div key={i} className="flex gap-2 items-start">
                        <span>{g.icon}</span>
                        <p className="leading-relaxed">{g.tip}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );

                    <tr key={p.id} className="border-b border-gray-50 hover:bg-gray-50/70 transition-colors">
                      <td className="px-4 py-3">
                        <p className="text-sm font-medium text-gray-800 line-clamp-1 max-w-48">{p.title}</p>
                      </td>
                      <td className="px-4 py-3"><CategoryBadge category={p.category} /></td>
                      <td className="px-4 py-3 text-xs text-gray-500 whitespace-nowrap">{p.createdAt}</td>
                      <td className="px-4 py-3 text-xs text-gray-500 whitespace-nowrap">{p.updatedAt}</td>
                      <td className="px-4 py-3 text-sm text-gray-700 font-medium">{p.views.toLocaleString()}</td>
                      <td className="px-4 py-3 text-sm text-gray-700 font-medium">{p.copies.toLocaleString()}</td>
                      <td className="px-4 py-3 text-sm text-gray-700 font-medium">{p.likes}</td>
                      <td className="px-4 py-3">
                        <span className="text-xs bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 rounded-full">공개</span>
                      </td>
                      <td className="px-4 py-3">
                        <div className="flex items-center gap-1">
                          <button onClick={() => nav('detail', p.id)}
                            className="p-1.5 rounded-md text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 btn-transition" title="상세 보기">
                            <IcEye size={14} />
                          </button>
                          <button onClick={() => nav('edit', p.id)}
                            className="p-1.5 rounded-md text-gray-500 hover:bg-amber-50 hover:text-amber-600 btn-transition" title="수정">
                            <IcEdit size={14} />
                          </button>
                          <button onClick={() => onDelete(p.id)}
                            className="p-1.5 rounded-md text-gray-500 hover:bg-red-50 hover:text-red-500 btn-transition" title="삭제">
                            <IcTrash size={14} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    };

    /* ===================== APP ===================== */
    function App() {
      const [prompts, setPrompts] = useState(INITIAL_PROMPTS);
      const [page, setPage] = useState('home');
      const [selectedId, setSelectedId] = useState(null);
      const [search, setSearch] = useState('');
      const [filterCat, setFilterCat] = useState('전체');
      const [sortBy, setSortBy] = useState('latest');
      const [toast, setToast] = useState({ show: false, msg: '' });
      const [deleteModal, setDeleteModal] = useState({ show: false, id: null, returnTo: 'list' });

      const mainRef = useRef(null);

      const nav = useCallback((newPage, id = null) => {
        setPage(newPage);
        if (id !== null) setSelectedId(id);
        if (newPage === 'detail' && id) {
          setPrompts(prev => prev.map(p => p.id === id ? { ...p, views: p.views + 1 } : p));
        }
        if (mainRef.current) mainRef.current.scrollTop = 0;
      }, []);

      const showToast = useCallback((msg) => {
        setToast({ show: true, msg });
        setTimeout(() => setToast({ show: false, msg: '' }), 2500);
      }, []);

      const onSearch = useCallback(() => {
        if (search.trim()) {
          setFilterCat('전체');
          nav('list');
        }
      }, [search, nav]);

      const toggleLike = useCallback((id) => {
        setPrompts(prev => prev.map(p =>
          p.id === id ? { ...p, isLiked: !p.isLiked, likes: p.isLiked ? p.likes - 1 : p.likes + 1 } : p
        ));
      }, []);

      const toggleFav = useCallback((id) => {
        setPrompts(prev => prev.map(p =>
          p.id === id ? { ...p, isFavorited: !p.isFavorited } : p
        ));
        const p = prompts.find(x => x.id === id);
        showToast(p?.isFavorited ? '즐겨찾기를 해제했습니다' : '즐겨찾기에 추가했습니다');
      }, [prompts, showToast]);

      const onCopy = useCallback((id) => {
        setPrompts(prev => prev.map(p => p.id === id ? { ...p, copies: p.copies + 1 } : p));
        showToast('프롬프트가 복사되었습니다');
      }, [showToast]);

      const addComment = useCallback((promptId, text) => {
        const newComment = {
          id: 'c-' + Date.now(),
          authorId: CURRENT_USER.id,
          authorName: CURRENT_USER.name,
          content: text,
          createdAt: new Date().toISOString().split('T')[0],
        };
        setPrompts(prev => prev.map(p =>
          p.id === promptId ? { ...p, comments: [...p.comments, newComment] } : p
        ));
      }, []);

      const deleteComment = useCallback((promptId, commentId) => {
        setPrompts(prev => prev.map(p =>
          p.id === promptId ? { ...p, comments: p.comments.filter(c => c.id !== commentId) } : p
        ));
      }, []);

      const requestDelete = useCallback((id, returnTo = 'list') => {
        setDeleteModal({ show: true, id, returnTo });
      }, []);

      const confirmDelete = useCallback(() => {
        const { id, returnTo } = deleteModal;
        setPrompts(prev => prev.filter(p => p.id !== id));
        setDeleteModal({ show: false, id: null, returnTo: 'list' });
        showToast('프롬프트가 삭제되었습니다');
        nav(returnTo);
      }, [deleteModal, showToast, nav]);

      const createPrompt = useCallback((formData) => {
        const newId = 'p-' + Date.now();
        const now = new Date().toISOString().split('T')[0];
        const newPrompt = {
          id: newId,
          title: formData.title,
          description: formData.description,
          category: formData.category,
          tags: formData.tags,
          authorId: CURRENT_USER.id,
          authorName: CURRENT_USER.name,
          createdAt: now,
          updatedAt: now,
          views: 0, copies: 0, likes: 0, isLiked: false, isFavorited: false,
          promptBody: formData.promptBody,
          howToUse: formData.howToUse,
          exampleInput: formData.exampleInput,
          exampleOutput: formData.exampleOutput,
          comments: [],
        };
        setPrompts(prev => [newPrompt, ...prev]);
        showToast('프롬프트가 등록되었습니다');
        nav('detail', newId);
      }, [showToast, nav]);

      const editPrompt = useCallback((formData) => {
        const now = new Date().toISOString().split('T')[0];
        setPrompts(prev => prev.map(p =>
          p.id === selectedId ? { ...p, ...formData, updatedAt: now } : p
        ));
        showToast('프롬프트가 수정되었습니다');
        nav('detail', selectedId);
      }, [selectedId, showToast, nav]);

      const selectedPrompt = useMemo(() =>
        prompts.find(p => p.id === selectedId), [prompts, selectedId]
      );

      const renderPage = () => {
        switch (page) {
          case 'home':
            return <HomePage prompts={prompts} nav={nav} search={search} setSearch={setSearch} onSearch={onSearch} />;
          case 'list':
            return <ListPage prompts={prompts} nav={nav} search={search} setSearch={setSearch}
                     filterCat={filterCat} setFilterCat={setFilterCat}
                     sortBy={sortBy} setSortBy={setSortBy}
                     onToggleFav={toggleFav} onToggleLike={toggleLike} onSearch={onSearch} />;
          case 'detail':
            return selectedPrompt
              ? <DetailPage prompt={selectedPrompt} nav={nav}
                  onToggleLike={toggleLike} onToggleFav={toggleFav} onCopy={onCopy}
                  onAddComment={addComment} onDeleteComment={deleteComment}
                  onDeletePrompt={(id) => requestDelete(id, 'list')} />
              : <div className="text-center py-20 text-gray-400">프롬프트를 찾을 수 없습니다</div>;
          case 'create':
            return <PromptForm mode="create" initialData={null} onSubmit={createPrompt} onCancel={() => nav('list')} />;
          case 'edit':
            return selectedPrompt
              ? <PromptForm mode="edit" initialData={selectedPrompt} onSubmit={editPrompt} onCancel={() => nav('detail', selectedId)} />
              : <div className="text-center py-20 text-gray-400">프롬프트를 찾을 수 없습니다</div>;
          case 'favorites':
            return <FavoritesPage prompts={prompts} nav={nav} onToggleFav={toggleFav} onToggleLike={toggleLike} />;
          case 'myPrompts':
            return <MyPromptsPage prompts={prompts} nav={nav} onDelete={(id) => requestDelete(id, 'myPrompts')} />;
          default:
            return null;
        }
      };

      return (
        <div className="flex h-screen bg-gray-50 overflow-hidden">
          <Sidebar page={page} nav={nav} />
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            <Header search={search} setSearch={setSearch} onSearch={onSearch} nav={nav} />
            <main ref={mainRef} className="flex-1 overflow-y-auto p-6">
              <div className="fade-in" key={page + selectedId}>
                {renderPage()}
              </div>
            </main>
          </div>
          {toast.show && <Toast message={toast.msg} />}
          {deleteModal.show && (
            <DeleteModal
              onConfirm={confirmDelete}
              onCancel={() => setDeleteModal({ show: false, id: null, returnTo: 'list' })}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
