<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>권한 관리 - AX Data Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/pages/permission.css">
</head>
<body>
<div class="app-wrapper">
  <aside id="layout-sidebar"></aside>
  <div class="main-area">
    <div id="layout-header"></div>
    <main class="page-content">

      <div class="page-header">
        <div>
          <div class="page-title">권한 관리</div>
          <div class="page-desc">메뉴별로 부서 접근 권한을 매핑하는 관리자 화면</div>
        </div>
        <button class="btn btn-primary" id="btnSavePermission"><i class="bi bi-save"></i> 저장</button>
      </div>

      <div class="permission-layout">

        <!-- Menu Tree -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">메뉴 선택</span>
          </div>
          <div class="card-body">
            <div class="input-group" style="margin-bottom:12px">
              <span class="input-group-icon"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control" id="permTreeSearch" placeholder="메뉴 검색">
            </div>
            <div class="menu-tree" id="permMenuTree">
              <div class="text-muted text-sm" style="text-align:center;padding:24px">로딩 중...</div>
            </div>
          </div>
        </div>

        <!-- Permission Mapping -->
        <div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">부서 접근 권한 매핑</span>
              <span class="text-sm text-muted">선택 메뉴 : <strong id="selectedMenuPath">-</strong></span>
            </div>
            <div class="table-wrap">
              <table class="table dept-table" id="deptPermTable">
                <thead>
                  <tr>
                    <th style="width:60%">부서/팀</th>
                    <th class="center">접근 허용</th>
                  </tr>
                </thead>
                <tbody id="deptPermTbody">
                  <tr>
                    <td colspan="2" class="text-muted text-sm" style="text-align:center;padding:40px">
                      <i class="bi bi-hand-index-thumb" style="font-size:28px;display:block;margin-bottom:8px;opacity:.3"></i>
                      왼쪽에서 메뉴를 선택하세요.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Summary -->
          <div class="permission-summary" id="permSummary" style="display:none">
            <div class="summary-box">
              <span class="summary-box-icon" style="color:var(--primary)"><i class="bi bi-grid-fill"></i></span>
              <div>
                <div class="summary-box-label">대상 메뉴</div>
                <div class="summary-box-value"><span id="summaryMenuCount">1</span> 메뉴</div>
              </div>
            </div>
            <div class="summary-box">
              <span class="summary-box-icon" style="color:var(--warning)"><i class="bi bi-people-fill"></i></span>
              <div>
                <div class="summary-box-label">적용 부서 수</div>
                <div class="summary-box-value"><span id="summaryTotalDept">0</span> 개</div>
              </div>
            </div>
            <div class="summary-box">
              <span class="summary-box-icon" style="color:var(--success)"><i class="bi bi-shield-check-fill"></i></span>
              <div>
                <div class="summary-box-label">접근 허용 부서 수</div>
                <div class="summary-box-value"><span id="summaryAllowed">0</span> 개</div>
                <div class="summary-box-sub" id="summaryPct"></div>
              </div>
            </div>
          </div>

          <div class="info-note">
            <i class="bi bi-info-circle-fill"></i>
            <span>부서가 명시적으로 허용된 메뉴만 접근 가능합니다. 관리자 계정은 모든 메뉴에 전체 접근 권한을 가집니다.</span>
          </div>
        </div>

      </div>

    </main>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/permission.js"></script>
<script>
  AXLayout.init({
    activeMenu: 'permission',
    breadcrumb: [{ label: '홈', href: 'home.html' }, { label: '권한 관리' }]
  });
  PermissionPage.init();
</script>
</body>
</html>
