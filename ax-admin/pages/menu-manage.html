<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 관리 - AX Data Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/pages/menu-manage.css">
</head>
<body>
<div class="app-wrapper">
  <aside id="layout-sidebar"></aside>
  <div class="main-area">
    <div id="layout-header"></div>
    <main class="page-content">

      <div class="page-header">
        <div>
          <div class="page-title">메뉴 관리</div>
          <div class="page-desc">대메뉴·서브메뉴·리포트 메뉴를 구성하고 데이터소스를 연결하는 관리자 화면</div>
        </div>
      </div>

      <div class="menu-manage-layout">

        <!-- Tree Panel -->
        <div class="card tree-panel">
          <div class="card-header">
            <span class="card-title">메뉴 트리</span>
            <button class="btn btn-primary btn-sm" id="btnAddMenu"><i class="bi bi-plus"></i> 추가</button>
          </div>
          <div class="card-body">
            <div class="tree-search-bar">
              <div class="input-group">
                <span class="input-group-icon"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="treeSearch" placeholder="메뉴 검색">
              </div>
            </div>
            <div class="menu-tree" id="menuTree">
              <div class="text-muted text-sm" style="text-align:center;padding:24px">로딩 중...</div>
            </div>
          </div>
        </div>

        <!-- Form Panel -->
        <div class="card" id="menuFormPanel">
          <div class="card-header">
            <span class="card-title">메뉴 정보</span>
            <span class="badge badge-primary" id="menuTypeBadge">리포트 메뉴</span>
          </div>
          <div class="card-body">
            <div class="empty-state" id="formEmptyState">
              <i class="bi bi-hand-index-thumb"></i>
              <p>왼쪽 메뉴 트리에서 항목을 선택하세요.</p>
            </div>
            <div id="menuFormContent" style="display:none">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">메뉴명 <span class="required">*</span></label>
                  <input type="text" class="form-control" id="fMenuName">
                </div>
                <div class="form-group">
                  <label class="form-label">메뉴유형 <span class="required">*</span></label>
                  <select class="form-control" id="fMenuType">
                    <option value="folder">폴더</option>
                    <option value="report">리포트 메뉴</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">상위메뉴 <span class="required">*</span></label>
                  <select class="form-control" id="fParentMenu"></select>
                </div>
                <div class="form-group">
                  <label class="form-label">정렬순서 <span class="required">*</span></label>
                  <input type="number" class="form-control" id="fOrder" value="10" min="1">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">설명</label>
                <textarea class="form-control" id="fDesc" rows="2" placeholder="메뉴 설명을 입력하세요."></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">사용여부</label>
                <label class="toggle-switch">
                  <input type="checkbox" id="fUseYn" checked>
                  <span class="toggle-slider"></span>
                </label>
              </div>

              <!-- Data Connection Section (report only) -->
              <div id="dataConnectionSection">
                <div class="form-section-title">데이터 연결 정보</div>
                <div class="form-group">
                  <label class="form-label">데이터소스 유형 <span class="required">*</span></label>
                  <div class="radio-group">
                    <label class="radio-label">
                      <input type="radio" name="dsType" value="SP" id="rdSP" checked> SP
                    </label>
                    <label class="radio-label">
                      <input type="radio" name="dsType" value="API" id="rdAPI"> API
                    </label>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group" id="spGroup">
                    <label class="form-label">SP 명 <span class="required">*</span></label>
                    <input type="text" class="form-control" id="fSpName" placeholder="SP_REPORT_NAME_V1">
                  </div>
                  <div class="form-group" id="apiGroup" style="display:none">
                    <label class="form-label">API 경로 <span class="required">*</span></label>
                    <input type="text" class="form-control" id="fApiPath" placeholder="/api/v1/reports/...">
                  </div>
                </div>

                <div class="form-section-title">기능 사용 여부</div>
                <div class="feature-toggles">
                  <div class="feature-toggle-row">
                    <span>시각화 사용</span>
                    <label class="toggle-switch"><input type="checkbox" id="fUseViz" checked><span class="toggle-slider"></span></label>
                  </div>
                  <div class="feature-toggle-row">
                    <span>스케줄 사용</span>
                    <label class="toggle-switch"><input type="checkbox" id="fUseSch" checked><span class="toggle-slider"></span></label>
                  </div>
                  <div class="feature-toggle-row">
                    <span>Excel 다운로드 사용</span>
                    <label class="toggle-switch"><input type="checkbox" id="fUseExcel" checked><span class="toggle-slider"></span></label>
                  </div>
                </div>
              </div>

              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px">
                <button class="btn btn-outline" id="btnCancelMenu">취소</button>
                <button class="btn btn-primary" id="btnSaveMenu"><i class="bi bi-save"></i> 저장</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Preview Panel -->
        <div class="card preview-panel">
          <div class="card-header">
            <span class="card-title">사용자 노출 미리보기</span>
          </div>
          <div class="card-body">
            <div class="breadcrumb-preview" id="previewBreadcrumb">
              <span class="bc-item"><i class="bi bi-house-fill"></i> 홈</span>
            </div>
            <div class="mini-report-preview">
              <div class="mini-report-header" id="previewReportName">리포트명</div>
              <div class="mini-report-body">
                <div class="mini-chart-line"><i class="bi bi-graph-up-arrow" style="font-size:20px;opacity:.5"></i></div>
                <div class="mini-table-stub">
                  <div class="mini-row-stub"></div>
                  <div class="mini-row-stub"></div>
                  <div class="mini-row-stub"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/menu-manage.js"></script>
<script>
  AXLayout.init({
    activeMenu: 'menu-manage',
    breadcrumb: [{ label: '홈', href: 'home.html' }, { label: '메뉴 관리' }]
  });
  MenuManagePage.init();
</script>
</body>
</html>
