<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈 - AX Data Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/pages/home.css">
</head>
<body>
<div class="app-wrapper">
  <aside id="layout-sidebar"></aside>
  <div class="main-area">
    <div id="layout-header"></div>
    <main class="page-content">

      <!-- Summary Cards -->
      <div class="stat-cards" id="statCards">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="bi bi-journals"></i></div>
          <div class="stat-info">
            <div class="stat-label">접근 가능 리포트 수</div>
            <div class="stat-value" id="statReports">-</div>
            <div class="stat-sub up" id="statReportsSub"></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i class="bi bi-play-circle-fill"></i></div>
          <div class="stat-info">
            <div class="stat-label">최근 실행</div>
            <div class="stat-value" id="statExec">-</div>
            <div class="stat-sub">최근 7일 기준</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange"><i class="bi bi-download"></i></div>
          <div class="stat-info">
            <div class="stat-label">최근 다운로드</div>
            <div class="stat-value" id="statDownload">7</div>
            <div class="stat-sub">최근 7일 기준</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple"><i class="bi bi-bell-fill"></i></div>
          <div class="stat-info">
            <div class="stat-label">공지사항 수</div>
            <div class="stat-value" id="statNotice">-</div>
            <div class="stat-sub danger" id="statNoticeSub"></div>
          </div>
        </div>
      </div>

      <!-- Content Grid -->
      <div class="home-grid">

        <!-- 최근 사용 리포트 -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">최근 사용 리포트</span>
            <a href="report-catalog.html" class="more-link">전체 보기 <i class="bi bi-chevron-right"></i></a>
          </div>
          <div class="table-wrap">
            <table class="table recent-table" id="recentReportsTable">
              <thead>
                <tr>
                  <th>리포트명</th>
                  <th>최근 실행</th>
                </tr>
              </thead>
              <tbody id="recentReportsTbody">
                <tr><td colspan="2" class="text-muted text-sm" style="text-align:center;padding:24px">로딩 중...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 최근 실행 이력 -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">최근 실행 이력</span>
            <a href="#" class="more-link">전체 보기 <i class="bi bi-chevron-right"></i></a>
          </div>
          <div class="table-wrap">
            <table class="table recent-table" id="execHistTable">
              <thead>
                <tr>
                  <th>리포트명</th>
                  <th>실행 시간</th>
                  <th class="center">상태</th>
                </tr>
              </thead>
              <tbody id="execHistTbody">
                <tr><td colspan="3" class="text-muted text-sm" style="text-align:center;padding:24px">로딩 중...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 공지사항 -->
        <div class="card card-notices">
          <div class="card-header">
            <span class="card-title">공지사항</span>
            <a href="#" class="more-link">전체 보기 <i class="bi bi-chevron-right"></i></a>
          </div>
          <div class="card-body" style="padding:8px 20px">
            <div class="notice-list" id="noticeList">
              <div class="text-muted text-sm" style="padding:24px 0;text-align:center">로딩 중...</div>
            </div>
          </div>
        </div>

      </div><!-- /.home-grid -->

    </main>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/home.js"></script>
<script>
  AXLayout.init({
    activeMenu: 'home',
    breadcrumb: [{ label: '홈' }]
  });
  HomePage.init();
</script>
</body>
</html>
