<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리포트 카탈로그 - AX Data Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/pages/report-catalog.css">
</head>
<body>
<div class="app-wrapper">
  <aside id="layout-sidebar"></aside>
  <div class="main-area">
    <div id="layout-header"></div>
    <main class="page-content">

      <div class="page-header">
        <div>
          <div class="page-title">리포트 카탈로그</div>
          <div class="page-desc">사용자가 접근 가능한 리포트를 검색·필터링·실행하는 화면</div>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="input-group">
          <span class="input-group-icon"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchKeyword" placeholder="리포트명 검색">
        </div>
        <select class="form-control" id="filterDept">
          <option value="">본부 전체</option>
          <option>도시사업본부</option>
          <option>경영지원본부</option>
          <option>IT본부</option>
          <option>품질분부</option>
        </select>
        <select class="form-control" id="filterDataSource">
          <option value="">데이터소스 전체</option>
          <option>DW_PURCHASE</option>
          <option>DW_SUPPLIER</option>
          <option>DW_SALES</option>
          <option>DW_MARKETING</option>
          <option>DW_FINANCE</option>
          <option>DW_CUSTOMER</option>
          <option>DW_INVENTORY</option>
          <option>DW_COST</option>
        </select>
        <select class="form-control" id="filterSchedule">
          <option value="">스케줄 가능 전체</option>
          <option value="true">스케줄 가능</option>
          <option value="false">스케줄 불가</option>
        </select>
        <button class="filter-reset" id="filterReset">
          <i class="bi bi-arrow-counterclockwise"></i> 필터 초기화
        </button>
      </div>

      <!-- Result -->
      <p class="result-count"><strong id="resultCount">0</strong>건의 리포트</p>

      <div class="card">
        <div class="table-wrap">
          <table class="table catalog-table">
            <thead>
              <tr>
                <th>리포트명</th>
                <th>메뉴경로</th>
                <th>데이터소스</th>
                <th>기본주기</th>
                <th>담당자</th>
                <th>마지막 수정일</th>
                <th class="center">실행</th>
              </tr>
            </thead>
            <tbody id="catalogTbody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">로딩 중...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="table-footer">
          <div class="page-size-select">
            페이지당
            <select class="form-control form-control-sm" id="pageSize" style="width:70px">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
            건
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/report-catalog.js"></script>
<script>
  AXLayout.init({
    activeMenu: 'report-catalog',
    breadcrumb: [{ label: '홈', href: 'home.html' }, { label: '리포트 카탈로그' }]
  });
  ReportCatalogPage.init();
</script>
</body>
</html>
